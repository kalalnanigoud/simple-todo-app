<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Todo App</title>
</head>
<body>
  <h1>Todos</h1>

  <form id="todo-form">
    <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off" />
    <button type="submit">Add</button>
  </form>

  <p id="status" role="status"></p>

  <input id="search" type="search" placeholder="Search todos" autocomplete="off" />

  <div>
    <button type="button" data-filter="all">All</button>
    <button type="button" data-filter="active">Active</button>
    <button type="button" data-filter="completed">Completed</button>
  </div>

  <ul id="todo-list"></ul>
  <p id="remaining"></p>

  <script type="module" src="src/app.js"></script>
</body>
</html>
